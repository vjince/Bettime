<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Mijn Weddenschappen Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Bet Tracker 📈</h1>

        <div class="input-section">
            <input type="text" id="wedstrijd" placeholder="Wat is de wedstrijd?">
            <input type="number" id="inzet" placeholder="Inzet (€)">
            <input type="number" id="odds" step="0.01" placeholder="Odds (bijv. 1.50)">
            <button id="voeg-toe">Weddenschap Opslaan</button>
        </div>

        <hr>

        <h2>Mijn Openstaande Weddenschappen</h2>
        <ul id="bet-lijst">
            </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
