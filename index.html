<<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijn Weddenschappen Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Bet Tracker 📈</h1>

        <div class="formulier">
            <label for="wedstrijd">Wedstrijd</label>
            <input type="text" id="wedstrijd" placeholder="Bijv. Ajax - Feyenoord">

            <div class="row">
                <div class="input-group">
                    <label for="datum">Datum</label>
                    <input type="date" id="datum">
                </div>
                <div class="input-group">
                    <label for="tijd">Tijd</label>
                    <input type="time" id="tijd">
                </div>
            </div>

            <label for="bookmaker">Bookmaker</label>
            <input type="text" id="bookmaker" placeholder="Bijv. Unibet of TOTO">

            <div class="row">
                <div class="input-group">
                    <label for="inzet">Inzet (€)</label>
                    <input type="number" id="inzet" placeholder="0.00" step="0.01">
                </div>
                <div class="input-group">
                    <label for="odds">Odds</label>
                    <input type="number" id="odds" placeholder="1.50" step="0.01">
                </div>
            </div>

            <button id="voeg-toe">Weddenschap Opslaan</button>
        </div>

        <hr>

        <h2>Mijn Weddenschappen</h2>
        <ul id="bet-lijst">
            </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
